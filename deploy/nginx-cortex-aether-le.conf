# CORTEX-AETHER: valid-TLS reverse proxy on :8446 -> Next.js on 127.0.0.1:3100.
# Additive site: reuses the existing Let's Encrypt certificate for ptclab-backup.duckdns.org
# (the same host this VPS is already reachable at); the other apps' nginx sites are untouched.
# Install once as root:
#   cp deploy/nginx-cortex-aether-le.conf /etc/nginx/sites-available/cortex-aether-le
#   ln -sf /etc/nginx/sites-available/cortex-aether-le /etc/nginx/sites-enabled/cortex-aether-le
#   nginx -t && systemctl reload nginx
# Renewals are handled by the existing certbot renewal for that cert.
server {
    listen 8446 ssl http2;
    listen [::]:8446 ssl http2;
    server_name ptclab-backup.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ptclab-backup.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptclab-backup.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Auth.js: derive the public origin from the real host + port
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8446;
        proxy_set_header X-Forwarded-Port 8446;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# CORTEX-AETHER: HTTPS reverse proxy on :8445 -> Next.js on 127.0.0.1:3100
# Installed by deploy/deploy.sh to /etc/nginx/sites-available/cortex-aether (+ symlink in sites-enabled).
# Uses its own self-signed certificate in /etc/ssl/cortex-aether/ (created by deploy.sh if missing).
server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/cortex-aether/cortex-aether.crt;
    ssl_certificate_key /etc/ssl/cortex-aether/cortex-aether.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
